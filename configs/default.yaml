seed: 42

providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
cache:
  enabled: true
  backend: redis           # Shared cache; requires docker compose up -d
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 100
  concurrency: 8

# Chaos scenarios override provider fail rates and define explicit pass criteria.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic should fallback"
    provider_overrides:
      primary: 1.0
    min_availability: 0.98
    min_fallback_success_rate: 0.95
    require_circuit_open: true
  - name: primary_flaky_50
    description: "Primary provider fails 50% — circuit should oscillate"
    provider_overrides:
      primary: 0.5
    min_availability: 0.98
    min_fallback_success_rate: 0.90
    require_circuit_open: true
    max_recovery_time_ms: 2500
  - name: all_healthy
    description: "Baseline — both providers healthy"
    provider_overrides:
      primary: 0.0
      backup: 0.0
    min_availability: 1.0
    max_circuit_open_count: 0
